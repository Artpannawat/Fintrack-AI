<div class="login-container">
  <div class="glass-panel login-card">
    <div class="logo-wrapper">
      <h2>FinTrack <span class="text-blue">AI</span></h2>
    </div>
    
    <p class="subtitle">Smart Personal Finance with AI</p>

    <button class="btn-glow google-btn" (click)="loginWithGoogle()" [disabled]="isLoading">
      <span *ngIf="isLoading" class="spinner"></span>
      <img *ngIf="!isLoading" src="https://authjs.dev/img/providers/google.svg" alt="Google Logo" class="google-icon">
      {{ isLoading ? 'Connecting...' : 'Continue with Google' }}
    </button>
  </div>
</div>
